<div>
  <hr />
  <h2>Custom Pipes</h2>
  <div class="transform">
    <div class="files">
      <strong>Normal Transform</strong>
      @for (file of files; track file) {
        <div>
          <div>{{ file.name }}:&nbsp;{{ file.size | filesize: " MB" }}</div>
        </div>
      }
    </div>
    <div class="files">
      <strong>Mapped Transform</strong>
      @for (file of mapped; track file) {
        <div>
          <div>{{ file.name }}:&nbsp;{{ file.size }}</div>
        </div>
      }
    </div>
  </div>
</div>
